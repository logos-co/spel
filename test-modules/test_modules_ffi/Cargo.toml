[package]
name = "test_modules_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
lee         = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
lee_core    = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
common      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2", features = ["client"] }
wallet      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
spel-framework-core = { path = "../../spel-framework-core" }
serde_json  = "1"
serde       = { version = "1", features = ["derive"] }
borsh       = "1.5"
tokio       = { version = "1", features = ["rt-multi-thread"] }
hex         = "0.4"
sha2        = "0.10"
test_modules_core = { path = "../test_modules_core" }
