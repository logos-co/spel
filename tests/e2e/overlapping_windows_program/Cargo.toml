[workspace]
members = ["mini_a", "mini_b", "mini_macros"]

[package]
name = "overlapping-windows-program"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spel-framework = { path = "../../../spel-framework" }
mini-a = { path = "mini_a" }
mini-b = { path = "mini_b" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = ["host"], package = "lee_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
