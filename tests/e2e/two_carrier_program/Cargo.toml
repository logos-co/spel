[workspace]
members = ["mini_ext", "mini_ext_macros"]

[package]
name = "two-carrier-program"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spel-framework = { path = "../../../spel-framework" }
mini-ext = { path = "mini_ext" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = ["host"], package = "lee_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
