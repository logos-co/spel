# SonarCloud Configuration for logos-co/spel
# https://sonarcloud.io/docs/sonarcloud-analysis/

sonar.projectKey=logos-co_spel
sonar.organization=logos-co

# Source directories
sonar.sources=spel-framework,spel-framework-core,spel-framework-macros,spel-cli,spel-client-gen

# Test directories
sonar.tests=tests

# Language
sonar.language=rust

# Rust-specific configuration
sonar.rust.cargo.manifestPath=Cargo.toml

# Coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/test_*/**,**/examples/**

# General exclusions
sonar.exclusions=**/target/**,**/.git/**,**/node_modules/**,**/docs/**,**/LICENSE-**,**/CHANGELOG.md,**/README.md,**/SPEC.md