[package]
name = "nft_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Not `workspace = true`: that would inherit the `host` feature into the guest build.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
