[package]
name = "token_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Not `workspace = true`: that would inherit the `host` feature into the guest build.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "616256b9c9efd2c28d4f7683b7b5d2348df7314e" }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
